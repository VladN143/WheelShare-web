<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <title>Șterge mașina</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to right, #fff, #f8d7da);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .delete-card {
      background-color: #fff;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
      max-width: 500px;
      width: 100%;
    }

    .btn-danger {
      width: 48%;
    }

    .btn-secondary {
      width: 48%;
    }
  </style>
</head>
<body>

  <div class="delete-card text-center">
    <h4 class="text-danger mb-4">Ești sigur că vrei să ștergi această mașină?</h4>
    <p><strong>{{ masina.model }} ({{ masina.an_fabricatie }})</strong></p>

    <form method="post" class="d-flex justify-content-between mt-4">
      {% csrf_token %}
      <button type="submit" class="btn btn-danger">Da, șterge</button>
      <a href="{% url 'home' %}" class="btn btn-secondary">Anulează</a>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
